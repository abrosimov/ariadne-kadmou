name: End-to-end

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    e2e:
        # Moves to the self-hosted runner once it exists.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/cache@v4
              with:
                  path: |
                      .hermetic/cache
                      .hermetic/stacks/node/pnpm-store
                      .hermetic/stacks/node/obsidian-cache
                  key: hermetic-e2e-${{ hashFiles('pins.env', 'pnpm-lock.yaml', 'manifest.json') }}
            - run: ./bin/bootstrap.sh
            # Without a DISPLAY, WebdriverIO gives each worker its own virtual display,
            # so parallel Obsidian windows do not take focus from one another.
            - run: .hermetic/stacks/node/bin/task e2e
