name: End-to-end

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    e2e:
        # Moves to the self-hosted runner once it exists.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ hashFiles('manifest.json', 'pnpm-lock.yaml') }}
            # Without a DISPLAY, WebdriverIO gives each worker its own virtual display,
            # so parallel Obsidian windows do not take focus from one another.
            - run: pnpm exec task e2e
