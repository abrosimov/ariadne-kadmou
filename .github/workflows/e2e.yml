name: End-to-end

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    e2e:
        # Moves to the self-hosted runner once it exists.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci
            - uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ hashFiles('manifest.json', 'package-lock.json') }}
            # Without a DISPLAY, WebdriverIO gives each worker its own virtual display,
            # so parallel Obsidian windows do not take focus from one another.
            - run: npm run e2e
