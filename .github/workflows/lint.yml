name: Check

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/cache@v4
              with:
                  path: |
                      .hermetic/cache
                      .hermetic/stacks/node/pnpm-store
                      .hermetic/stacks/node/corepack
                      .hermetic/xdg-cache
                  key: hermetic-${{ hashFiles('pins.env', 'package.json', 'pnpm-lock.yaml') }}
            # Installs the pinned Node and Task below .hermetic/, then task install.
            - run: ./bin/bootstrap.sh
            - run: .hermetic/stacks/node/bin/task check
