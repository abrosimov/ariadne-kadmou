name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile

            - name: The tag names the manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  [ "$tag" = "$version" ] || { echo "tag $tag differs from manifest version $version"; exit 1; }

            - run: pnpm exec task check

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            # Published, not drafted: BRAT installs from published releases only.
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" --title="$tag" --notes "Ariadne kadmou $tag" \
                    main.js manifest.json styles.css
